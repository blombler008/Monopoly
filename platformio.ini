; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
lib_dir = lib
test_dir = test
default_envs = release

[env]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino
build_unflags = 
	-std=gnu++11
build_flags = 
	-DCORE_DEBUG_LEVEL=5
	-DCONFIG_ARDUHAL_LOG_COLORS=1
	-Wdeprecated-declarations
	-std=gnu++2a
	-DWIFI_PASSWORD='"testtest"'
	-DWIFI_SSID='"Wickinger"' 
monitor_speed = 115200
monitor_echo = true
monitor_filters = 
	time
	esp32_exception_decoder
lib_deps =  
	makerspaceleiden/MFRC522-spi-i2c-uart-async@^1.5.1
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^9.2.0
	esphome/ESP32-audioI2S@^2.0.7
	robtillaart/I2CKeyPad@^0.5.0
board_build.filesystem = spiffs
platform_packages = tool-esp32partitiontool @ https://github.com/serifpersia/esp32partitiontool/releases/download/v1.4.4/esp32partitiontool-platformio.zip
extra_scripts = partition_manager.py

[env:debug]
build_type = debug
build_unflags = 
	${env.build_unflags}
	-Os
build_flags = 
	${env.build_flags}
	-Og
	-g3
	-fno-inline-functions-called-once
	-Dota=0 

[env:release]
build_type = release
build_unflags = 
	${env.build_unflags}
build_flags = 
	${env.build_flags}
	-Dota=0 

[env:release_ota]
build_type = release
build_unflags = 
	${env.build_unflags}
build_flags = 
	${env.build_flags}
	-Dota=0
upload_speed = 921600
upload_protocol = espota
upload_port = esp32-monopoly.local
upload_flags = 
	--port=3232
	--auth=25043791567516997125-admin 
